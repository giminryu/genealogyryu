<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>연간 행사 달력 - 종친회</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSRF meta (JS에서 읽어 사용) -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="_csrf_parameterName" th:content="${_csrf.parameterName}"/>

    <style>
        .fc { --fc-border-color: #e9ecef; }
        .fc .fc-daygrid-event { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0"><i class="bi bi-calendar-event me-2"></i>연간 행사</h2>
        <div>
            <a href="/events" class="btn btn-outline-secondary"><i class="bi bi-card-list me-2"></i>경조사 목록</a>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div id="calendar"></div>
        </div>
    </div>
</div>

<!-- 날짜별 일정 목록/등록 모달 -->
<div class="modal fade" id="dayModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-calendar-event me-2"></i><span id="modalDateLabel"></span> 일정</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <!-- 일정 목록 -->
                <div id="eventList" class="mb-4"></div>

                <hr>

                <!-- 새 일정 등록 -->
                <h6 class="mb-3"><i class="bi bi-plus-circle me-2"></i>새 일정 등록</h6>
                <form id="createForm" th:action="@{/events/create}" th:object="${event}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="eventDate" id="createEventDate"/>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">제목</label>
                            <input type="text" th:field="*{title}" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">유형</label>
                            <select class="form-select" th:field="*{type}" required>
                                <option value="CELEBRATION">경사</option>
                                <option value="CONDOLENCE">조사</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{important}">
                                <label class="form-check-label">중요</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">내용</label>
                            <textarea class="form-control" rows="5" th:field="*{content}" required></textarea>
                        </div>
                    </div>

                    <div class="text-end mt-3">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-2"></i>등록</button>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- 달력 초기화 스크립트 -->
<script th:inline="javascript">
    /*<![CDATA[*/
    // 서버에서 전달된 전체 이벤트
    const allEvents = /*[[${events}]]*/ [];

    // FullCalendar 이벤트 변환
    const fcEvents = (allEvents || []).map(e => ({
        id: e.id,
        title: e.title,
        start: e.eventDate, // yyyy-MM-dd
        allDay: true,
        extendedProps: {
            viewUrl: `/events/${e.id}`,
            editUrl: `/events/${e.id}/edit`,
            deleteUrl: `/events/${e.id}/delete`,
            type: e.type,
            important: e.important,
            author: e.author
        }
    }));

    // CSRF meta 값
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content || '';
    const csrfParam = document.querySelector('meta[name="_csrf_parameterName"]')?.content || '_csrf';

    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'ko',
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,listMonth' },
            events: fcEvents,
            dateClick: (info) => openDayModal(info.dateStr),
            eventClick: (info) => { window.location.href = info.event.extendedProps.viewUrl; }
        });
        calendar.render();

        const dayModal = new bootstrap.Modal(document.getElementById('dayModal'));
        const listContainer = document.getElementById('eventList');
        const dateLabel = document.getElementById('modalDateLabel');
        const createEventDate = document.getElementById('createEventDate');

        function openDayModal(dateStr) {
            const dayEvents = fcEvents.filter(e => e.start === dateStr);
            dateLabel.textContent = dateStr;
            createEventDate.value = dateStr;

            if (dayEvents.length === 0) {
                listContainer.innerHTML = '<div class="text-muted">이 날짜에 등록된 일정이 없습니다.</div>';
            } else {
                // 삭제 폼에 CSRF 토큰 주입
                listContainer.innerHTML = `
          <ul class="list-group">
            ${dayEvents.map(ev => `
              <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                  ${ev.extendedProps.important ? '<span class="badge bg-danger me-2">중요</span>' : ''}
                  <span class="badge bg-secondary me-2">${ev.extendedProps.type}</span>
                  <a href="${ev.extendedProps.viewUrl}" class="text-decoration-none">${ev.title}</a>
                </div>
                <div class="btn-group btn-group-sm">
                  <a href="${ev.extendedProps.editUrl}" class="btn btn-outline-warning"><i class="bi bi-pencil"></i></a>
                  <form action="${ev.extendedProps.deleteUrl}" method="post" onsubmit="return confirm('삭제하시겠습니까?');">
                    <input type="hidden" name="${csrfParam}" value="${csrfToken}"/>
                    <button type="submit" class="btn btn-outline-danger"><i class="bi bi-trash"></i></button>
                  </form>
                </div>
              </li>
            `).join('')}
          </ul>
        `;
            }

            dayModal.show();
        }

        // 전역 노출
        window.openDayModal = openDayModal;
    });
    /*]]>*/
</script>
</body>
</html>
