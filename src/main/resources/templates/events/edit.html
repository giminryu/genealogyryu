<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>경조사 수정 - 종친회</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-flower3 me-2"></i>경조사 수정</h2>
    <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-outline-secondary"><i class="bi bi-card-list me-2"></i>상세</a>
  </div>

  <div class="card">
    <div class="card-body">
      <form th:action="@{/events/{id}/edit(id=${event.id})}" th:object="${event}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
          <label for="title" class="form-label">제목</label>
          <input id="title" type="text" th:field="*{title}" class="form-control" required>
          <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">제목 오류</div>
        </div>

        <div class="mb-3">
          <label for="content" class="form-label">내용</label>
          <textarea id="content" th:field="*{content}" class="form-control" rows="10" required></textarea>
          <div class="text-danger small" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">내용 오류</div>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="type" class="form-label">유형</label>
            <select id="type" class="form-select" th:field="*{type}" required>
              <option th:value="CELEBRATION">경사</option>
              <option th:value="CONDOLENCE">조사</option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label for="eventDate" class="form-label">일자</label>
            <input id="eventDate" type="date" class="form-control" th:field="*{eventDate}" required>
          </div>
          <div class="col-md-4 mb-3 d-flex align-items-center">
            <div class="form-check form-switch mt-4">
              <input class="form-check-input" type="checkbox" id="important" th:field="*{important}">
              <label class="form-check-label" for="important">중요 표시</label>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between">
          <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left-circle me-2"></i>상세로</a>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-2"></i>저장</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
