<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>경조사 통계</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title mb-0">
                            <i class="bi bi-graph-up me-2"></i>경조사 통계
                        </h3>
                    </div>
                    <div class="card-body">
                        <!-- 전체 통계 -->
                        <div class="row mb-4">
                            <div class="col-md-3">
                                <div class="card bg-primary text-white">
                                    <div class="card-body text-center">
                                        <i class="bi bi-calendar-event display-4"></i>
                                        <h4 th:text="${totalEvents}">0</h4>
                                        <p>전체 경조사</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-success text-white">
                                    <div class="card-body text-center">
                                        <i class="bi bi-emoji-smile display-4"></i>
                                        <h4 th:text="${eventsByType.stream().filter(e -> e[0] == 'CELEBRATION').findFirst().map(e -> e[1]).orElse(0)}">0</h4>
                                        <p>경사</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-secondary text-white">
                                    <div class="card-body text-center">
                                        <i class="bi bi-emoji-frown display-4"></i>
                                        <h4 th:text="${eventsByType.stream().filter(e -> e[0] == 'CONDOLENCE').findFirst().map(e -> e[1]).orElse(0)}">0</h4>
                                        <p>조사</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-danger text-white">
                                    <div class="card-body text-center">
                                        <i class="bi bi-exclamation-triangle display-4"></i>
                                        <h4 th:text="${importantEvents.size()}">0</h4>
                                        <p>중요 경조사</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 상세 통계 -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h5 class="card-title mb-0">유형별 경조사 수</h5>
                                    </div>
                                    <div class="card-body">
                                        <div th:if="${eventsByType.empty}" class="text-center py-3">
                                            <p class="text-muted">데이터가 없습니다.</p>
                                        </div>
                                        <div th:if="${!eventsByType.empty}">
                                            <div class="table-responsive">
                                                <table class="table table-sm">
                                                    <thead>
                                                        <tr>
                                                            <th>유형</th>
                                                            <th>개수</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr th:each="stat : ${eventsByType}">
                                                            <td>
                                                                <span th:if="${stat[0] == 'CELEBRATION'}" class="badge bg-success">경사</span>
                                                                <span th:if="${stat[0] == 'CONDOLENCE'}" class="badge bg-secondary">조사</span>
                                                            </td>
                                                            <td th:text="${stat[1]}"></td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h5 class="card-title mb-0">월별 경조사 수</h5>
                                    </div>
                                    <div class="card-body">
                                        <div th:if="${eventsByMonth.empty}" class="text-center py-3">
                                            <p class="text-muted">데이터가 없습니다.</p>
                                        </div>
                                        <div th:if="${!eventsByMonth.empty}">
                                            <div class="table-responsive">
                                                <table class="table table-sm">
                                                    <thead>
                                                        <tr>
                                                            <th>월</th>
                                                            <th>개수</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr th:each="stat : ${eventsByMonth}">
                                                            <td th:text="${stat[0]} + '월'"></td>
                                                            <td th:text="${stat[1]}"></td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 최근 경조사 -->
                        <div class="row mt-4">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-header">
                                        <h5 class="card-title mb-0">최근 경조사</h5>
                                    </div>
                                    <div class="card-body">
                                        <div th:if="${importantEvents.empty}" class="text-center py-3">
                                            <p class="text-muted">최근 경조사가 없습니다.</p>
                                        </div>
                                        <div th:if="${!importantEvents.empty}">
                                            <div class="table-responsive">
                                                <table class="table table-hover">
                                                    <thead>
                                                        <tr>
                                                            <th>제목</th>
                                                            <th>유형</th>
                                                            <th>일자</th>
                                                            <th>작성자</th>
                                                            <th>조회수</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr th:each="event : ${importantEvents}">
                                                            <td>
                                                                <a th:href="@{/events/{id}(id=${event.id})}" th:text="${event.title}"></a>
                                                                <span th:if="${event.important}" class="badge bg-danger ms-1">중요</span>
                                                            </td>
                                                            <td>
                                                                <span th:if="${event.type == 'CELEBRATION'}" class="badge bg-success">경사</span>
                                                                <span th:if="${event.type == 'CONDOLENCE'}" class="badge bg-secondary">조사</span>
                                                            </td>
                                                            <td th:text="${#temporals.format(event.eventDate, 'yyyy-MM-dd')}"></td>
                                                            <td th:text="${event.author}"></td>
                                                            <td th:text="${event.viewCount}"></td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <a href="/events" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>목록으로
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
