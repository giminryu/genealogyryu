<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${event.title}">경조사 상세 - 종친회</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-flower3 me-2"></i>경조사 상세</h2>
    <a href="/events" class="btn btn-outline-secondary"><i class="bi bi-card-list me-2"></i>목록</a>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <h3 class="mb-3" th:text="${event.title}">제목</h3>
      <div class="text-muted small mb-3">
        <span><i class="bi bi-person me-1"></i><span th:text="${event.author}">작성자</span></span>
        <span class="ms-3"><i class="bi bi-calendar-event me-1"></i><span th:text="${event.eventDate}">2025-01-01</span></span>
        <span class="ms-3"><i class="bi bi-tags me-1"></i><span th:text="${event.type}">CELEBRATION</span></span>
        <span class="ms-3"><i class="bi bi-eye me-1"></i><span th:text="${event.viewCount}">0</span>회 조회</span>
      </div>
      <div th:if="${event.important}" class="mb-3">
        <span class="badge bg-danger">중요</span>
      </div>
      <div th:utext="${event.content}">내용</div>
    </div>
  </div>

  <div class="d-flex justify-content-between">
    <a class="btn btn-outline-secondary" href="/events"><i class="bi bi-arrow-left-circle me-2"></i>목록으로</a>
    <div>
      <a class="btn btn-outline-warning" th:if="${canEdit}" th:href="@{|/events/${event.id}/edit|}"><i class="bi bi-pencil me-2"></i>수정</a>
      <form th:if="${canDelete}" th:action="@{|/events/${event.id}/delete|}" method="post" style="display:inline;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-outline-danger" onclick="return confirm('정말 삭제하시겠습니까?');"><i class="bi bi-trash me-2"></i>삭제</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
