<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인기 경조사</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <h3 class="card-title mb-0">
                            <i class="bi bi-fire me-2"></i>인기 경조사
                        </h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${events.empty}" class="text-center py-5">
                            <i class="bi bi-info-circle display-1 text-muted"></i>
                            <h4 class="mt-3 text-muted">인기 경조사가 없습니다.</h4>
                        </div>
                        
                        <div th:if="${!events.empty}">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>순위</th>
                                            <th>제목</th>
                                            <th>유형</th>
                                            <th>일자</th>
                                            <th>작성자</th>
                                            <th>조회수</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="event, stat : ${events}">
                                            <td>
                                                <span th:if="${stat.index < 3}" class="badge bg-warning text-dark" th:text="${stat.index + 1}"></span>
                                                <span th:if="${stat.index >= 3}" th:text="${stat.index + 1}"></span>
                                            </td>
                                            <td>
                                                <a th:href="@{/events/{id}(id=${event.id})}" th:text="${event.title}"></a>
                                                <span th:if="${event.important}" class="badge bg-danger ms-1">중요</span>
                                            </td>
                                            <td>
                                                <span th:if="${event.type == 'CELEBRATION'}" class="badge bg-success">경사</span>
                                                <span th:if="${event.type == 'CONDOLENCE'}" class="badge bg-secondary">조사</span>
                                            </td>
                                            <td th:text="${#temporals.format(event.eventDate, 'yyyy-MM-dd')}"></td>
                                            <td th:text="${event.author}"></td>
                                            <td>
                                                <i class="bi bi-eye me-1"></i>
                                                <span th:text="${event.viewCount}"></span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <a href="/events" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>목록으로
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
