<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공지사항 통계</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title mb-0">
                            <i class="bi bi-graph-up me-2"></i>공지사항 통계
                        </h3>
                    </div>
                    <div class="card-body">
                        <!-- 전체 통계 -->
                        <div class="row mb-4">
                            <div class="col-md-3">
                                <div class="card bg-primary text-white">
                                    <div class="card-body text-center">
                                        <i class="bi bi-file-text display-4"></i>
                                        <h4 th:text="${totalNotices}">0</h4>
                                        <p>전체 공지사항</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-danger text-white">
                                    <div class="card-body text-center">
                                        <i class="bi bi-exclamation-triangle display-4"></i>
                                        <h4 th:text="${importantNotices.size()}">0</h4>
                                        <p>중요 공지사항</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-warning text-dark">
                                    <div class="card-body text-center">
                                        <i class="bi bi-fire display-4"></i>
                                        <h4 th:text="${popularNotices.size()}">0</h4>
                                        <p>인기 공지사항</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-success text-white">
                                    <div class="card-body text-center">
                                        <i class="bi bi-clock-history display-4"></i>
                                        <h4 th:text="${recentNotices.size()}">0</h4>
                                        <p>최신 공지사항</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 월별 통계 -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h5 class="card-title mb-0">월별 공지사항 수</h5>
                                    </div>
                                    <div class="card-body">
                                        <div th:if="${noticesByMonth.empty}" class="text-center py-3">
                                            <p class="text-muted">데이터가 없습니다.</p>
                                        </div>
                                        <div th:if="${!noticesByMonth.empty}">
                                            <div class="table-responsive">
                                                <table class="table table-sm">
                                                    <thead>
                                                        <tr>
                                                            <th>월</th>
                                                            <th>공지사항 수</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr th:each="stat : ${noticesByMonth}">
                                                            <td th:text="${stat[0]} + '월'"></td>
                                                            <td th:text="${stat[1]}"></td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h5 class="card-title mb-0">최근 공지사항</h5>
                                    </div>
                                    <div class="card-body">
                                        <div th:if="${recentNotices.empty}" class="text-center py-3">
                                            <p class="text-muted">최근 공지사항이 없습니다.</p>
                                        </div>
                                        <div th:if="${!recentNotices.empty}">
                                            <div class="list-group list-group-flush">
                                                <div th:each="notice : ${recentNotices}" class="list-group-item">
                                                    <div class="d-flex justify-content-between align-items-start">
                                                        <div>
                                                            <a th:href="@{/notices/{id}(id=${notice.id})}" th:text="${notice.title}"></a>
                                                            <span th:if="${notice.important}" class="badge bg-danger ms-1">중요</span>
                                                        </div>
                                                        <small class="text-muted" th:text="${#temporals.format(notice.createdAt, 'MM-dd')}"></small>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <a href="/notices" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>목록으로
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
