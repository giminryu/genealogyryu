<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('로그인', ~{::section})}">
<head>
    <title>로그인</title>
</head>
<body>
    <section>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white text-center">
                            <h4 class="mb-0">
                                <i class="bi bi-box-arrow-in-right me-2"></i>로그인
                            </h4>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/login}" method="post">
                                <!-- CSRF 토큰 -->
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                
                                <div class="mb-3">
                                    <label for="username" class="form-label">아이디</label>
                                    <input type="text" class="form-control" id="username" name="username" 
                                           autocomplete="username" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="password" class="form-label">비밀번호</label>
                                    <input type="password" class="form-control" id="password" name="password" 
                                           autocomplete="current-password" required>
                                </div>
                                
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-box-arrow-in-right me-2"></i>로그인
                                    </button>
                                </div>
                            </form>
                            
                            <div th:if="${param.error}" class="alert alert-danger mt-3">
                                <i class="bi bi-exclamation-triangle me-2"></i>
                                아이디 또는 비밀번호가 올바르지 않습니다.
                            </div>
                            
                            <div th:if="${param.logout}" class="alert alert-success mt-3">
                                <i class="bi bi-check-circle me-2"></i>
                                로그아웃 되었습니다.
                            </div>
                        </div>
                        <div class="card-footer text-center">
                            <small class="text-muted">
                                <strong>데모 계정:</strong><br>
                                일반 사용자: user / user1234<br>
                                관리자: admin / admin1234
                            </small>
                        </div>
                    </div>
                    
                    <div class="text-center mt-3">
                        <a href="/" class="btn btn-outline-secondary">
                            <i class="bi bi-house me-2"></i>홈으로 돌아가기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
