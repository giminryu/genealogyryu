<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 내보내기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title mb-0">
                            <i class="bi bi-download me-2"></i>회원 내보내기
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h5 class="card-title mb-0">내보내기 옵션</h5>
                                    </div>
                                    <div class="card-body">
                                        <form th:action="@{/members/export/csv}" method="get">
                                            <div class="mb-3">
                                                <label class="form-label">포함할 필드</label>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" name="fields" value="id" id="fieldId" checked>
                                                    <label class="form-check-label" for="fieldId">회원 ID</label>
                                                </div>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" name="fields" value="name" id="fieldName" checked>
                                                    <label class="form-check-label" for="fieldName">이름</label>
                                                </div>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" name="fields" value="phone" id="fieldPhone" checked>
                                                    <label class="form-check-label" for="fieldPhone">전화번호</label>
                                                </div>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" name="fields" value="email" id="fieldEmail">
                                                    <label class="form-check-label" for="fieldEmail">이메일</label>
                                                </div>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" name="fields" value="birthDate" id="fieldBirthDate">
                                                    <label class="form-check-label" for="fieldBirthDate">생년월일</label>
                                                </div>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" name="fields" value="familyRank" id="fieldFamilyRank">
                                                    <label class="form-check-label" for="fieldFamilyRank">항렬</label>
                                                </div>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" name="fields" value="address" id="fieldAddress">
                                                    <label class="form-check-label" for="fieldAddress">주소</label>
                                                </div>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" name="fields" value="joinDate" id="fieldJoinDate">
                                                    <label class="form-check-label" for="fieldJoinDate">가입일</label>
                                                </div>
                                            </div>
                                            
                                            <div class="mb-3">
                                                <label class="form-label">상태 필터</label>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="radio" name="status" value="all" id="statusAll" checked>
                                                    <label class="form-check-label" for="statusAll">전체</label>
                                                </div>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="radio" name="status" value="active" id="statusActive">
                                                    <label class="form-check-label" for="statusActive">활성 회원만</label>
                                                </div>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="radio" name="status" value="inactive" id="statusInactive">
                                                    <label class="form-check-label" for="statusInactive">비활성 회원만</label>
                                                </div>
                                            </div>
                                            
                                            <button type="submit" class="btn btn-primary">
                                                <i class="bi bi-download me-1"></i>CSV 다운로드
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h5 class="card-title mb-0">내보내기 통계</h5>
                                    </div>
                                    <div class="card-body">
                                        <div class="row text-center">
                                            <div class="col-6">
                                                <div class="border rounded p-3">
                                                    <h4 class="text-primary" th:text="${members.size()}">0</h4>
                                                    <p class="mb-0">전체 회원</p>
                                                </div>
                                            </div>
                                            <div class="col-6">
                                                <div class="border rounded p-3">
                                                    <h4 class="text-success" th:text="${members.stream().filter(m -> m.active).count()}">0</h4>
                                                    <p class="mb-0">활성 회원</p>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <hr>
                                        
                                        <h6>최근 가입 회원 (최근 10명)</h6>
                                        <div class="list-group list-group-flush">
                                            <div th:each="member : ${members.stream().limit(10).toList()}" class="list-group-item d-flex justify-content-between align-items-center">
                                                <div>
                                                    <strong th:text="${member.name}"></strong>
                                                    <small class="text-muted d-block" th:text="${member.phone}"></small>
                                                </div>
                                                <small class="text-muted" th:text="${#temporals.format(member.joinDate, 'MM-dd')}"></small>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <a href="/members" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>목록으로
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
