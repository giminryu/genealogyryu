<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 검색 결과</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title mb-0">
                            <i class="bi bi-search me-2"></i>회원 검색 결과
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <form th:action="@{/members/search}" method="get" class="row g-3">
                                <div class="col-md-6">
                                    <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="검색어를 입력하세요">
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select" name="type">
                                        <option value="name" th:selected="${searchType == 'name'}">이름</option>
                                        <option value="phone" th:selected="${searchType == 'phone'}">전화번호</option>
                                        <option value="email" th:selected="${searchType == 'email'}">이메일</option>
                                        <option value="address" th:selected="${searchType == 'address'}">주소</option>
                                        <option value="familyRank" th:selected="${searchType == 'familyRank'}">항렬</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="bi bi-search me-1"></i>검색
                                    </button>
                                </div>
                            </form>
                        </div>
                        
                        <div class="alert alert-info" th:if="${keyword}">
                            <strong th:text="${keyword}"></strong>에 대한 검색 결과: <span th:text="${members.size()}"></span>건
                        </div>
                        
                        <div th:if="${members.empty}" class="text-center py-5">
                            <i class="bi bi-search display-1 text-muted"></i>
                            <h4 class="mt-3 text-muted">검색 결과가 없습니다.</h4>
                            <p class="text-muted">다른 검색어를 시도해보세요.</p>
                        </div>
                        
                        <div th:if="${!members.empty}">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>번호</th>
                                            <th>이름</th>
                                            <th>전화번호</th>
                                            <th>이메일</th>
                                            <th>항렬</th>
                                            <th>가입일</th>
                                            <th>상태</th>
                                            <th>관리</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="member : ${members}">
                                            <td th:text="${member.id}"></td>
                                            <td>
                                                <a th:href="@{/members/{id}(id=${member.id})}" th:text="${member.name}"></a>
                                            </td>
                                            <td th:text="${member.phone}"></td>
                                            <td th:text="${member.email != null ? member.email : '-'}"></td>
                                            <td th:text="${member.familyRank != null ? member.familyRank : '-'}"></td>
                                            <td th:text="${#temporals.format(member.joinDate, 'yyyy-MM-dd')}"></td>
                                            <td>
                                                <span th:if="${member.active}" class="badge bg-success">활성</span>
                                                <span th:unless="${member.active}" class="badge bg-secondary">비활성</span>
                                            </td>
                                            <td>
                                                <a th:href="@{/members/{id}/edit(id=${member.id})}" class="btn btn-sm btn-outline-primary">
                                                    <i class="bi bi-pencil"></i>
                                                </a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <a href="/members" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>목록으로
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
