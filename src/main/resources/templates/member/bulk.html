<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 일괄 관리</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title mb-0">
                            <i class="bi bi-gear me-2"></i>회원 일괄 관리
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-warning">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            <strong>주의:</strong> 일괄 삭제는 되돌릴 수 없습니다. 신중하게 선택해주세요.
                        </div>
                        
                        <form th:action="@{/members/bulk/delete}" method="post" id="bulkForm">
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="selectAll()">
                                            <i class="bi bi-check-all me-1"></i>전체 선택
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="deselectAll()">
                                            <i class="bi bi-x-circle me-1"></i>전체 해제
                                        </button>
                                    </div>
                                    <div>
                                        <span class="text-muted">선택된 회원: <span id="selectedCount">0</span>명</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th width="50">
                                                <input type="checkbox" class="form-check-input" id="selectAll">
                                            </th>
                                            <th>번호</th>
                                            <th>이름</th>
                                            <th>전화번호</th>
                                            <th>이메일</th>
                                            <th>항렬</th>
                                            <th>가입일</th>
                                            <th>상태</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="member : ${members}">
                                            <td>
                                                <input type="checkbox" class="form-check-input member-checkbox" 
                                                       name="memberIds" th:value="${member.id}">
                                            </td>
                                            <td th:text="${member.id}"></td>
                                            <td th:text="${member.name}"></td>
                                            <td th:text="${member.phone}"></td>
                                            <td th:text="${member.email != null ? member.email : '-'}"></td>
                                            <td th:text="${member.familyRank != null ? member.familyRank : '-'}"></td>
                                            <td th:text="${#temporals.format(member.joinDate, 'yyyy-MM-dd')}"></td>
                                            <td>
                                                <span th:if="${member.active}" class="badge bg-success">활성</span>
                                                <span th:unless="${member.active}" class="badge bg-secondary">비활성</span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            
                            <div class="mt-3">
                                <button type="button" class="btn btn-danger" onclick="confirmBulkDelete()" id="bulkDeleteBtn" disabled>
                                    <i class="bi bi-trash me-1"></i>선택된 회원 삭제
                                </button>
                                <a href="/members" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left me-1"></i>목록으로
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 삭제 확인 모달 -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">일괄 삭제 확인</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>선택된 <strong id="deleteCount">0</strong>명의 회원을 삭제하시겠습니까?</p>
                    <p class="text-danger">이 작업은 되돌릴 수 없습니다.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-danger" onclick="submitBulkDelete()">삭제</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 전체 선택/해제
        function selectAll() {
            document.querySelectorAll('.member-checkbox').forEach(checkbox => {
                checkbox.checked = true;
            });
            document.getElementById('selectAll').checked = true;
            updateSelectedCount();
        }
        
        function deselectAll() {
            document.querySelectorAll('.member-checkbox').forEach(checkbox => {
                checkbox.checked = false;
            });
            document.getElementById('selectAll').checked = false;
            updateSelectedCount();
        }
        
        // 선택된 개수 업데이트
        function updateSelectedCount() {
            const selectedCount = document.querySelectorAll('.member-checkbox:checked').length;
            document.getElementById('selectedCount').textContent = selectedCount;
            document.getElementById('bulkDeleteBtn').disabled = selectedCount === 0;
        }
        
        // 전체 선택 체크박스 이벤트
        document.getElementById('selectAll').addEventListener('change', function() {
            document.querySelectorAll('.member-checkbox').forEach(checkbox => {
                checkbox.checked = this.checked;
            });
            updateSelectedCount();
        });
        
        // 개별 체크박스 이벤트
        document.querySelectorAll('.member-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', updateSelectedCount);
        });
        
        // 일괄 삭제 확인
        function confirmBulkDelete() {
            const selectedCount = document.querySelectorAll('.member-checkbox:checked').length;
            document.getElementById('deleteCount').textContent = selectedCount;
            new bootstrap.Modal(document.getElementById('deleteModal')).show();
        }
        
        // 일괄 삭제 실행
        function submitBulkDelete() {
            document.getElementById('bulkForm').submit();
        }
        
        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            updateSelectedCount();
        });
    </script>
</body>
</html>
