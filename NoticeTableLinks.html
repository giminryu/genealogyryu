<!-- 일부만 발췌: 목록 테이블/리스트 반복 영역 안에 링크 추가 -->
<tr th:each="notice : ${notices}">
  <td th:text="${notice.id}">1</td>
  <td>
    <a th:href="@{|/notices/${notice.id}|}" th:text="${notice.title}">제목</a>
  </td>
  <td th:text="${notice.author}">작성자</td>
  <td th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}">2025-08-14</td>
</tr>
