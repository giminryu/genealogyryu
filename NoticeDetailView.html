<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title th:text="${notice.title}">공지 상세</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    .notice-view { max-width: 860px; margin: 40px auto; padding: 0 16px; }
    .notice-header { border-bottom: 1px solid #ddd; margin-bottom: 16px; }
    .notice-title { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
    .notice-meta { color: #666; font-size: 14px; margin-bottom: 16px; }
    .notice-content { white-space: pre-wrap; line-height: 1.6; }
    .notice-actions { display: flex; gap: 8px; margin-top: 24px; }
    .btn { padding: 8px 12px; border: 1px solid #ccc; background: #f8f8f8; text-decoration: none; color: #222; border-radius: 4px; }
    .btn.primary { background: #0d6efd; color: #fff; border-color: #0d6efd; }
    .btn.danger { background: #dc3545; color: #fff; border-color: #dc3545; }
  </style>
</head>
<body>
  <main class="notice-view">
    <header class="notice-header">
      <h1 class="notice-title" th:text="${notice.title}">공지 제목</h1>
      <div class="notice-meta">
        <span>작성자: <strong th:text="${notice.author}">관리자</strong></span>
        <span> | 등록일: <span th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}">2025-08-14 12:00</span></span>
        <span th:if="${notice.updatedAt != null}"> | 수정일: <span th:text="${#temporals.format(notice.updatedAt, 'yyyy-MM-dd HH:mm')}">2025-08-14 13:00</span></span>
        <span th:if="${notice.viewCount != null}"> | 조회수: <span th:text="${notice.viewCount}">0</span></span>
      </div>
    </header>

    <section class="notice-content" th:text="${notice.content}">
      공지 내용이 여기에 표시됩니다.
    </section>

    <div class="notice-actions">
      <a class="btn" th:href="@{/notices}">목록</a>
      <a class="btn primary" th:href="@{|/notices/${notice.id}/edit|}">수정</a>
      <form th:action="@{|/notices/${notice.id}/delete|}" method="post" th:object="${notice}" style="display:inline;">
        <button type="submit" class="btn danger" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
      </form>
    </div>
  </main>
</body>
</html>
